# Render Blueprint — Web Service
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: website-reverse-engineering
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright
    # Optional: enable browser rendering on paid plans with more RAM
    # buildCommand can be extended with: playwright install chromium --with-deps
